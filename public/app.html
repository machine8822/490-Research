</div>

<button aria-label="Toggle password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface active:bg-surface-container transition-colors" id="togglePassword" type="button">

<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">shield</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">End-to-End Encrypted</span>
<span class="font-body-sm text-body-sm text-secondary">Zero-knowledge proof</span>
</div>
</div>
<div class="bg-surface-container-low/70 rounded-xl p-space-sm flex items-center gap-space-sm">
<span class="material-symbols-outlined text-tertiary text-[20px]">lock_reset</span>

</div>

        Sign up
      </a>
</div>
</div>

<script>
  // Password Visibility Toggle Interaction
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive Live Feedback for Identifier
  const identifierInput = document.getElementById('identifier');
  const identifierIcon = document.getElementById('identifierIcon');
  const identifierBadge = document.getElementById('identifierBadge');

  if (identifierInput) {
    identifierInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val.includes('@') && val.length > 5) {
        identifierBadge.classList.remove('hidden');
        identifierIcon.classList.add('text-primary');
        identifierIcon.classList.remove('text-secondary');
      } else {
        identifierBadge.classList.add('hidden');
        identifierIcon.classList.add('text-secondary');
        identifierIcon.classList.remove('text-primary');
      }
    });
  }
  
</script>
